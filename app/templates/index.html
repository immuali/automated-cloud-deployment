<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Automated Cloud Deployment</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .card {
            width: min(600px, 85%);
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(15, 23, 42, 0.12);
            text-align: center;
        }

        .status {
            display: inline-block;
            margin-top: 15px;
            padding: 9px 18px;
            color: #166534;
            background: #dcfce7;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Automated Cloud Deployment Pipeline</h1>

        <p>
            A containerized Flask web application deployed to AWS
            using Terraform and GitHub Actions.
        </p>

        <div class="status">Application Running</div>
    </main>
</body>
</html>
