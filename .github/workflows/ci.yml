name: Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: capstone-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::565265042363:role/github-actions-capstone-deploy
          aws-region: us-east-1
          allowed-account-ids: "565265042363"
          role-session-name: capstone-oidc-check

      - name: Verify AWS identity
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: aws sts get-caller-identity

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest app/tests -v

      - name: Build Docker image
        run: docker build -t capstone-app:ci .

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: automated-cloud-deployment-dev-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag capstone-app:ci "$IMAGE_URI"
          docker push "$IMAGE_URI"
      - name: Download current ECS task definition
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          TASK_DEFINITION=$(aws ecs describe-services \
            --cluster dev-capstone-cluster \
            --services dev-capstone-service \
            --query 'services[0].taskDefinition' \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION" \
            --query taskDefinition \
            --output json > task-definition.json
      - name: Update task definition image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: app
          image: ${{ steps.login-ecr.outputs.registry }}/automated-cloud-deployment-dev-app:${{ github.sha }}

      - name: Deploy to Amazon ECS
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: dev-capstone-service
          cluster: dev-capstone-cluster
          wait-for-service-stability: true