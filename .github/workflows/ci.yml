name: Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::565265042363:role/github-actions-capstone-deploy
          aws-region: us-east-1
          allowed-account-ids: "565265042363"
          role-session-name: capstone-oidc-check

      - name: Verify AWS identity
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: aws sts get-caller-identity

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest app/tests -v

      - name: Build Docker image
        run: docker build -t capstone-app:ci .